[project]
name = "reos-vs001"
version = "0.1.0"
description = "REOS Constitutional Bootstrap"
requires-python = ">=3.11"

dependencies = [
	"jsonschema>=4.23.0",
	"pyyaml>=6.0.2",
	"pytest>=8.3.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

id: REOS-004
type: recognition_transition
status: RATIFIED

title: Directional Momentum Qualification

horizon: Movement Horizon

prerequisites:
  - v0.1.0-reos-vs001
  - v0.2.0-reos-vs002
  - v0.3.0-reos-vs003
  - v1.0.0-reos-topology-001

description: >
  Extend a constitutionally resolved recognition state into governed
  directional admission, momentum assessment, and movement qualification.

  REOS-004 consumes a compiler-certified TransitionTopology bound by exact
  identity and digest through TransitionContract. Runtime components may
  contextualize ratified one-hop directed edges but may not invent, infer,
  modify, substitute, or expand topology.

  REOS-004 qualifies whether one admitted directional relationship possesses
  sufficient governed evidence for later movement processing. It does not
  execute movement, activate a Shunt, invoke Ontology, select a remedy, or
  produce a protocol.

constitutional_intent:
  - preserve the frozen Recognition Horizon
  - consume frozen REOS-TOPOLOGY-001 structural law
  - distinguish structural direction from evidentiary momentum
  - qualify directional evidence without executing movement
  - preserve uncertainty when no single direction qualifies
  - prevent active SEAM state from silently becoming movement authority
  - prevent runtime topology invention or substitution
  - establish one canonical actionable recognition boundary below the Recognition Freeze Line
  - establish one canonical verified topology boundary for directional generation
  - prohibit independent downstream authority for nested recognition evidence
  - preserve directional candidate identity and population through momentum evaluation
  - require typed qualification reasons and termination evidence

inputs:
  - recognition_unit
  - candidate_basin_evaluation
  - basin_selection
  - seam_activation_condition
  - orientation_resolution
  - seam_aware_recognition_result
  - transition_topology
  - transition_contract

movement_ingress_rule:
  sole_actionable_recognition_input:
    - frozen_recognition_bundle

  sole_actionable_topology_input:
    - verified_topology_bundle

  independently_actionable_below_freeze_line:
    candidate_basin_evaluation: false
    basin_selection: false
    seam_activation_condition: false
    orientation_resolution: false
    seam_aware_recognition_result: false
    transition_topology: false

outputs:
  - frozen_recognition_bundle
  - verified_topology_bundle
  - directional_candidate_set
  - directional_momentum_assessment
  - movement_qualification_result
  - transition_telemetry

authorized_operations:
  - ingress_hash
  - instantiate_recognition_unit
  - generate_candidate_basins
  - evaluate_candidate_basins
  - determine_primary_basin
  - record_rejected_basins
  - detect_seam_activation
  - resolve_orientation
  - assemble_recognition_result
  - bind_recognition_checkpoint
  - verify_topology_binding
  - generate_directional_candidates
  - evaluate_directional_momentum
  - qualify_movement
  - emit_transition_telemetry

topology_authority:
  required: true
  topology_id: TT-REOS-001
  topology_version: 1.0.0
  topology_digest: COMPILER_BOUND
  maximum_hops: 1
  permitted_relationship_types:
    - DIRECT_MOVEMENT_ELIGIBILITY

operation_parameters:
  bind_recognition_checkpoint:
    required_artifact_count: 5

    required_artifact_kinds:
      - CANDIDATE_BASIN_EVALUATION
      - BASIN_SELECTION
      - SEAM_ACTIVATION_CONDITION
      - ORIENTATION_RESOLUTION
      - SEAM_AWARE_RECOGNITION_RESULT

    exact_artifact_set_required: true
    additional_artifact_bindings_prohibited: true
    duplicate_artifact_kinds_prohibited: true
    duplicate_artifact_ids_prohibited: true
    exactly_one_binding_per_required_kind: true

    canonical_artifact_binding_sequence:
      - CANDIDATE_BASIN_EVALUATION
      - BASIN_SELECTION
      - SEAM_ACTIVATION_CONDITION
      - ORIENTATION_RESOLUTION
      - SEAM_AWARE_RECOGNITION_RESULT

    canonical_artifact_binding_sequence_required: true
    artifact_binding_sequence_is_identity_bearing: true

    stateless_operation_required: true
    mutable_actor_state_prohibited: true

    boundary_opacity_rules:
      candidate_scores_are_semantically_opaque: true
      evidence_basis_is_semantically_opaque: true
      seam_metrics_are_semantically_opaque: true
      orientation_meaning_is_semantically_opaque: true

      complete_artifact_state_may_be_serialized_for_digest: true

      prohibit_candidate_score_interpretation: true
      prohibit_candidate_score_thresholding: true
      prohibit_candidate_ranking: true
      prohibit_evidence_quality_judgment: true

      prohibit_topology_inspection: true
      prohibit_transition_contract_inspection: true
      prohibit_telemetry_inspection: true
      prohibit_timestamp_inspection: true
      prohibit_system_clock_inspection: true
      prohibit_execution_environment_inspection: true

      prohibit_lineage_repair: true
      prohibit_missing_artifact_reconstruction: true
      prohibit_nested_artifact_identity_generation: true
      prohibit_domain_state_inference: true

    artifact_authenticity:
      nominal_noun_identity_required: true
      structural_lookalike_substitution_prohibited: true
      slot_label_alone_is_not_sufficient_authenticity: true

      ingress_authenticity_rules:
        model: CONSTITUTIONAL_NOUN_ADMISSIBILITY

        constitutional_principles:
          python_class_identity_is_not_constitutional_identity: true
          structural_similarity_is_not_constitutional_authority: true
          canonical_serializability_is_not_constitutional_authority: true
          slot_position_is_not_constitutional_authority: true

        requires:
          - ratified_artifact_kind_to_governed_noun_binding
          - authorized_governed_noun_identity
          - complete_canonical_state_representation
          - unbroken_required_lineage

        prohibits:
          - structural_duck_typing_as_authentication
          - unauthorized_structural_lookalike_admission
          - serializability_as_sole_authentication
          - matching_fields_as_sole_authentication
          - slot_label_as_sole_authentication

        governed_noun_identity_proof_mechanism: NOT_YET_REIFIED

      authorization_adjudication:
        scope:
          constitutional_question: >
            Is this independently verified representation constitutionally authorized
            to stand for the declared governed noun under the active authority context?
          pre_state: VERIFIED_BUT_UNAUTHORIZED_NOUN_REPRESENTATION
          post_state: AUTHORIZED_GOVERNED_NOUN_REPRESENTATION

        failure_reason_vocabulary:
          declaration_controlled: true
          runtime_reason_invention_prohibited: true
          constitutional_reason_codes:
            - AUTH_EVIDENCE_INVALID
            - AUTH_CONTEXT_INVALID
            - AUTH_REPRESENTATION_INVALID
            - AUTH_VERIFICATION_INVALID
            - AUTH_VERIFICATION_COVERAGE_INVALID
            - AUTH_GOVERNED_NOUN_CORRESPONDENCE_INVALID
            - AUTH_IDENTITY_COHERENCE_INVALID

        reason_code_semantics:
          AUTH_EVIDENCE_INVALID:
            protected_stable_truth: complete_and_well_formed_required_authorization_evidence
            may_subsume:
              - missing_required_evidence
              - malformed_artifact_digest
              - malformed_verification_report_digest
              - missing_cni_basis_material

          AUTH_CONTEXT_INVALID:
            protected_stable_truth: legitimate_authority_context_and_operation_authority_required
            may_subsume:
              - contract_digest_mismatch
              - authority_context_mismatch
              - operation_not_authorized

          AUTH_REPRESENTATION_INVALID:
            protected_stable_truth: representation_requires_valid_canonical_content_commitment
            may_subsume:
              - artifact_canonical_digest_mismatch
              - artifact_identity_content_mismatch

          AUTH_VERIFICATION_INVALID:
            protected_stable_truth: independent_verification_evidence_must_be_legitimate_and_integrity_bound
            may_subsume:
              - report_digest_mismatch
              - report_unsuccessful_or_unverified
              - invalid_independent_verification_evidence

          AUTH_VERIFICATION_COVERAGE_INVALID:
            protected_stable_truth: valid_verification_evidence_must_cover_exact_target_representation
            constitutionally_distinct_from:
              - AUTH_VERIFICATION_INVALID

          AUTH_GOVERNED_NOUN_CORRESPONDENCE_INVALID:
            protected_stable_truth: artifact_must_lawfully_correspond_to_declaration_scoped_governed_noun
            may_subsume:
              - mapping_absent
              - mapping_mismatch
              - structural_lookalike_substitution
              - class_or_reflection_substitution

          AUTH_IDENTITY_COHERENCE_INVALID:
            protected_stable_truth: authorization_identity_and_envelope_coherence_must_be_deterministic_and_non_conflicting
            may_subsume:
              - duplicate_authorization_identity
              - context_bound_identity_inconsistency
              - authorization_identity_derivation_inconsistency

        constitutional_failure_precedence:
          deterministic_precedence_required: true
          first_failing_constitutional_category_required: true
          multiple_failure_aggregation_prohibited: true
          ordered_categories:
            - AUTH_EVIDENCE_INVALID
            - AUTH_CONTEXT_INVALID
            - AUTH_REPRESENTATION_INVALID
            - AUTH_VERIFICATION_INVALID
            - AUTH_VERIFICATION_COVERAGE_INVALID
            - AUTH_GOVERNED_NOUN_CORRESPONDENCE_INVALID
            - AUTH_IDENTITY_COHERENCE_INVALID
          runtime_precedence_discretion_prohibited: true

        implementation_freedom_below_constitutional_semantics:
          internal_check_order_constitutionally_fixed: false
          permitted:
            - check_combination
            - check_splitting
            - internal_reordering
            - precomputation
            - parallelization
          required:
            - identical_admissible_evidence_must_emit_identical_constitutional_reason_category
            - helper_call_order_is_not_constitutional_law

        binder_jurisdiction_firewall:
          authorization_failure_categories_must_not_assert:
            - checkpoint_completeness
            - checkpoint_uniqueness
            - checkpoint_canonical_sequence
            - checkpoint_lineage_closure
            - checkpoint_digest
            - bundle_identity
            - freeze_line_validity
            - movement_admission
          remains_under_recognition_checkpoint_binder: true
          authorization_failure_terminates_before_binder_checkpoint_adjudication: true

        telemetry_subreason_policy:
          non_constitutional_structured_detail_permitted: true
          constraints:
            - must_not_create_additional_constitutional_reason_codes
            - must_not_change_constitutional_precedence
            - must_not_redefine_declared_failure_category
          classification: IMPLEMENTATION_OR_TELEMETRY_ONLY

        coverage_projection:
          protected_stable_truth: >
            Independent verification evidence is sufficient for authorization only when
            the declared evidence surface identifies and commits to the same exact
            immutable artifact representation whose canonical content digest is being
            authorized.

          identity_content_coverage_separation_clause: >
            artifact identity != artifact content commitment != exact representation
            coverage. Identity reference alone is insufficient. Exact representation
            coverage requires declaration-controlled composition of independent
            verification legitimacy, exact artifact identity binding, declared
            companion evidence, canonical content commitment, authorization-side
            canonical digest recomputation, and required identity/lineage/context
            equalities.

          composite_coverage_law: >
            Exact representation coverage exists only when all required conditions hold:
            1. the primary verification report is independently valid/successful;
            2. the report identifies the target artifact instance where that report
               family exposes a direct artifact identity reference;
            3. the declared companion evidence identifies the same target artifact
               instance;
            4. the companion evidence carries the required canonical content
               commitment;
            5. authorization adjudication independently recomputes the target artifact
               canonical digest;
            6. the recomputed digest equals the declared companion content
               commitment;
            7. all declaration-required lineage/context equalities hold.
            Failure of any required relationship resolves as AUTH_VERIFICATION_COVERAGE_INVALID.
            Coverage may not be inferred from common transition, common contract,
            runtime class, structural similarity, artifact role, temporal proximity,
            or identity reference alone.

          coverage_projection_table:
            candidate_basin_evaluation:
              artifact_noun: CandidateBasinEvaluation
              artifact_identity_field: evaluation_id
              primary_verification_family: VS003VerificationReport
              report_artifact_reference_field: evaluation_id
              report_success_condition: verified == true and selection_evaluation_lineage, seam_evaluation_lineage, seam_recognition_unit_lineage, orientation_selection_lineage, orientation_seam_lineage checks all pass
              companion_evidence_family: VS003TransitionTelemetry
              companion_artifact_reference_field: evaluation_id
              companion_content_commitment_field: candidate_evaluation_digest
              required_lineage_equalities:
                - VS003VerificationReport.evaluation_id == CandidateBasinEvaluation.evaluation_id
                - VS003TransitionTelemetry.evaluation_id == CandidateBasinEvaluation.evaluation_id
              canonical_artifact_projection: canonical content projection of complete declared CandidateBasinEvaluation state
              required_digest_equality: VS003TransitionTelemetry.candidate_evaluation_digest == canonical digest of the complete declared CandidateBasinEvaluation state

            basin_selection:
              artifact_noun: BasinSelection
              artifact_identity_field: selection_id
              primary_verification_family: VS003VerificationReport
              report_artifact_reference_field: selection_id
              report_success_condition: verified == true and selection_evaluation_lineage, orientation_selection_lineage, orientation_seam_lineage, primary_basin_preserved, compiler_parameters_applied, seam_state_verified, orientation_state_verified checks all pass
              companion_evidence_family: VS003TransitionTelemetry
              companion_artifact_reference_field: selection_id
              companion_content_commitment_field: selection_digest
              required_lineage_equalities:
                - VS003VerificationReport.selection_id == BasinSelection.selection_id
                - VS003TransitionTelemetry.selection_id == BasinSelection.selection_id
                - VS003TransitionTelemetry.evaluation_id == BasinSelection.evaluation_id
              canonical_artifact_projection: canonical content projection of complete declared BasinSelection state
              required_digest_equality: VS003TransitionTelemetry.selection_digest == canonical digest of the complete declared BasinSelection state

            seam_condition:
              artifact_noun: SeamActivationCondition
              artifact_identity_field: condition_id
              primary_verification_family: VS003VerificationReport
              report_artifact_reference_field: seam_condition_id
              report_success_condition: verified == true and seam_evaluation_lineage, seam_recognition_unit_lineage, orientation_selection_lineage, orientation_seam_lineage, primary_basin_preserved, compiler_parameters_applied, seam_state_verified, orientation_state_verified checks all pass
              companion_evidence_family: VS003TransitionTelemetry
              companion_artifact_reference_field: seam_condition_id
              companion_content_commitment_field: seam_condition_digest
              required_lineage_equalities:
                - VS003VerificationReport.seam_condition_id == SeamActivationCondition.condition_id
                - VS003TransitionTelemetry.seam_condition_id == SeamActivationCondition.condition_id
                - VS003TransitionTelemetry.evaluation_id == SeamActivationCondition.evaluation_id
                - VS003TransitionTelemetry.recognition_unit_id == SeamActivationCondition.recognition_unit_id
              canonical_artifact_projection: canonical content projection of complete declared SeamActivationCondition state
              required_digest_equality: VS003TransitionTelemetry.seam_condition_digest == canonical digest of the complete declared SeamActivationCondition state

            orientation_resolution:
              artifact_noun: OrientationResolution
              artifact_identity_field: resolution_id
              primary_verification_family: VS003VerificationReport
              report_artifact_reference_field: orientation_resolution_id
              report_success_condition: verified == true and orientation_selection_lineage, orientation_seam_lineage, primary_basin_preserved, compiler_parameters_applied, seam_state_verified, orientation_state_verified checks all pass
              companion_evidence_family: VS003TransitionTelemetry
              companion_artifact_reference_field: orientation_resolution_id
              companion_content_commitment_field: orientation_resolution_digest
              required_lineage_equalities:
                - VS003VerificationReport.orientation_resolution_id == OrientationResolution.resolution_id
                - VS003TransitionTelemetry.orientation_resolution_id == OrientationResolution.resolution_id
                - VS003TransitionTelemetry.selection_id == OrientationResolution.selection_id
                - VS003TransitionTelemetry.seam_condition_id == OrientationResolution.seam_condition_id
              canonical_artifact_projection: canonical content projection of complete declared OrientationResolution state
              required_digest_equality: VS003TransitionTelemetry.orientation_resolution_digest == canonical digest of the complete declared OrientationResolution state

            seam_aware_recognition_result:
              artifact_noun: SeamAwareRecognitionResult
              artifact_identity_field: result_id
              primary_verification_family: VS003VerificationReport
              report_artifact_reference_field: orientation_resolution_id
              report_success_condition: verified == true and orientation_selection_lineage, orientation_seam_lineage, primary_basin_preserved, compiler_parameters_applied, seam_state_verified, orientation_state_verified checks all pass
              companion_evidence_family: VS003TransitionTelemetry
              companion_artifact_reference_field: result_id
              companion_content_commitment_field: result_digest
              required_lineage_equalities:
                - VS003VerificationReport.orientation_resolution_id == SeamAwareRecognitionResult.orientation_resolution_id
                - VS003TransitionTelemetry.result_id == SeamAwareRecognitionResult.result_id
                - VS003TransitionTelemetry.orientation_resolution_id == SeamAwareRecognitionResult.orientation_resolution_id
                - VS003TransitionTelemetry.recognition_unit_id == SeamAwareRecognitionResult.base_result.recognition_unit_id
                - SeamAwareRecognitionResult.base_result.orientation.primary_basin == SeamAwareRecognitionResult.primary_basin
              canonical_artifact_projection: canonical content projection of complete declared SeamAwareRecognitionResult state
              required_digest_equality: VS003TransitionTelemetry.result_digest == canonical digest of the complete declared SeamAwareRecognitionResult state

          seam_aware_projection_complete: true

          self_assertion_firewall: >
            Coverage must not be established solely by caller assertion, artifact
            identity alone, report identity alone, Python class/runtime type,
            structural similarity, shared transition_id, shared contract context,
            temporal proximity, or artifact role similarity. Declaration policy may
            define how existing evidence composes; it may not manufacture absent
            evidence.

          report_digest_rule: >
            Use the existing canonical report digest rule. Authorization must
            recompute and validate verification_report_digest before relying on report
            coverage. No new global digest doctrine is created.

          authorization_actor_jurisdiction:
            owns:
              - deterministic application of declared coverage projections
              - canonical artifact digest recomputation
              - required equality evaluation
              - AUTH_VERIFICATION_COVERAGE_INVALID emission
            does_not_own:
              - creation of verification facts
              - definition of verification truth
              - invention of companion evidence
              - repair or modification of verifier outputs
              - Binder checkpoint membership
              - Binder lineage closure
              - Binder sequence
              - Binder digest
              - freeze-line validity
              - Movement admission

          implementation_freedom_clause: >
            Freeze only constitutional evidence relationships and equality
            requirements. Do not freeze helper ordering, method decomposition,
            internal stage topology, caching, precomputation, or parallel
            evaluation. Identical evidence must resolve to identical constitutional
            coverage outcome.

          reason_code_on_coverage_failure:
            AUTH_VERIFICATION_COVERAGE_INVALID

      required_kind_to_noun:
        CANDIDATE_BASIN_EVALUATION:
          governed_noun: CandidateBasinEvaluation

        BASIN_SELECTION:
          governed_noun: BasinSelection

        SEAM_ACTIVATION_CONDITION:
          governed_noun: SeamActivationCondition

        ORIENTATION_RESOLUTION:
          governed_noun: OrientationResolution

        SEAM_AWARE_RECOGNITION_RESULT:
          governed_noun: SeamAwareRecognitionResult

      requirements:
        - each_required_slot_contains_its_ratified_governed_noun
        - artifact_kind_must_correspond_to_actual_governed_noun
        - structurally_similar_foreign_noun_must_fail_closed
        - binder_may_not_relabel_foreign_noun_as_required_kind

    canonical_artifact_content_projection:
      projection_scope: COMPLETE_DECLARED_NOUN_STATE

      recursive_rules:
        declared_fields:
          include_all: true
          preserve_declared_field_names: true

        nested_declared_nouns:
          recursively_project_complete_declared_state: true

        ordered_sequences:
          preserve_element_order: true

        optional_values:
          preserve_null_explicitly: true

        strings:
          preserve_exact_value: true
          whitespace_normalization_prohibited: true
          case_normalization_prohibited: true

        numeric_values:
          preserve_exact_canonical_numeric_value: true
          semantic_interpretation_prohibited: true

        mappings:
          canonical_key_ordering_required: true

      prohibited:
        - field_omission
        - semantic_normalization
        - whitespace_cleanup
        - case_conversion
        - inferred_default_insertion
        - domain_value_reinterpretation
        - omission_of_null_declared_fields

    canonical_artifact_digest_material:
      exact_fields:
        - artifact_kind
        - artifact_id
        - artifact_content

      artifact_content:
        source: canonical_artifact_content_projection

      additional_fields_prohibited: true
      omitted_fields_prohibited: true
      field_names_identity_bearing: true

      digest_function:
        service: canonical_hash

    canonical_recognition_checkpoint_material:
      material_type:
        value: RECOGNITION_CHECKPOINT
        identity_bearing: true

      exact_fields:
        - material_type
        - recognition_unit_id
        - candidate_evaluation_ref
        - basin_selection_ref
        - seam_activation_condition_ref
        - orientation_resolution_ref
        - seam_aware_result_ref
        - artifact_bindings

      artifact_bindings:
        sequence: CANONICAL_ARTIFACT_BINDING_SEQUENCE
        entry_exact_fields:
          - artifact_kind
          - artifact_id
          - artifact_digest

      additional_fields_prohibited: true
      omitted_fields_prohibited: true

      excluded_from_checkpoint_material:
        - bundle_id
        - recognition_checkpoint_digest

      digest_function:
        service: canonical_hash

    recognition_checkpoint_digest_derivation:
      input:
        canonical_recognition_checkpoint_material

      operation:
        canonical_hash

      deterministic: true

      runtime_salt_prohibited: true
      timestamp_prohibited: true
      random_value_prohibited: true
      environment_value_prohibited: true

    frozen_recognition_bundle_id_derivation:
      prefix: "FRB-"

      material:
        exact_fields:
          - material_type
          - recognition_checkpoint_digest

        material_type:
          value: FROZEN_RECOGNITION_BUNDLE_ID
          identity_bearing: true

      operation:
        canonical_hash

      digest_slice:
        start: 0
        length: 16

      output_transform:
        uppercase: true

      final_form:
        prefix_then_digest_slice: true

      deterministic: true

      runtime_assigned_identity_prohibited: true
      random_identity_prohibited: true
      timestamp_identity_prohibited: true

    recognition_checkpoint_failure_mapping:
      authorization_ingress_precedence:
        deterministic_precedence_required: true
        first_failing_stage_terminates_binding: true
        multiple_failure_aggregation_prohibited: true

        ordered_stages:
          - stage: 0
            name: AUTHORIZATION_ENVELOPE_LEGITIMACY
            failure_reason: RECOGNITION_CHECKPOINT_AUTHORIZATION_ENVELOPE_INVALID

          - stage: 0
            name: PER_ARTIFACT_AUTHORIZATION_COVERAGE
            failure_reason: RECOGNITION_CHECKPOINT_ARTIFACT_UNAUTHORIZED

      missing_required_artifact:
        reason_code: MISSING_REQUIRED_ARTIFACT

      artifact_authenticity_failure:
        reason_code: ARTIFACT_TYPE_MISMATCH

      candidate_evaluation_vs_seam_recognition_unit_mismatch:
        reason_code: RECOGNITION_UNIT_MISMATCH

      basin_selection_evaluation_link_mismatch:
        reason_code: EVALUATION_LINEAGE_MISMATCH

      seam_condition_evaluation_link_mismatch:
        reason_code: EVALUATION_LINEAGE_MISMATCH

      orientation_selection_link_mismatch:
        reason_code: SELECTION_LINEAGE_MISMATCH

      orientation_seam_condition_link_mismatch:
        reason_code: SEAM_LINEAGE_MISMATCH

      seam_aware_result_orientation_link_mismatch:
        reason_code: ORIENTATION_LINEAGE_MISMATCH

      base_result_recognition_unit_mismatch:
        reason_code: BASE_RESULT_RECOGNITION_UNIT_MISMATCH

      base_result_selection_outcome_mismatch:
        reason_code: BASE_RESULT_SELECTION_OUTCOME_MISMATCH

      artifact_set_mismatch:
        reason_code: ARTIFACT_SET_MISMATCH

      duplicate_artifact_kind:
        reason_code: DUPLICATE_ARTIFACT_KIND

      duplicate_artifact_id:
        reason_code: DUPLICATE_ARTIFACT_ID

      canonical_sequence_violation:
        reason_code: CANONICAL_SEQUENCE_VIOLATION

      digest_construction_failure:
        reason_code: DIGEST_CONSTRUCTION_FAILURE

      recognition_checkpoint_authorization_envelope_invalid:
        reason_code: RECOGNITION_CHECKPOINT_AUTHORIZATION_ENVELOPE_INVALID

      recognition_checkpoint_artifact_unauthorized:
        reason_code: RECOGNITION_CHECKPOINT_ARTIFACT_UNAUTHORIZED

    exact_failure_mapping_required: true
    runtime_failure_mapping_discretion_prohibited: true

    recognition_checkpoint_validation_precedence:
      deterministic_precedence_required: true
      first_failing_stage_terminates_binding: true
      multiple_failure_aggregation_prohibited: true

      ordered_stages:
        - stage: 1
          name: REQUIRED_ARTIFACT_COMPLETENESS

        - stage: 2
          name: ARTIFACT_AUTHENTICITY

        - stage: 3
          name: DIRECT_RECOGNITION_UNIT_PARITY

        - stage: 4
          name: EVALUATION_LINEAGE

        - stage: 5
          name: SELECTION_LINEAGE

        - stage: 6
          name: SEAM_LINEAGE

        - stage: 7
          name: ORIENTATION_LINEAGE

        - stage: 8
          name: BASE_RESULT_RECOGNITION_UNIT_PARITY

        - stage: 9
          name: BASE_RESULT_SELECTION_OUTCOME_PARITY

        - stage: 10
          name: ARTIFACT_SET_AND_UNIQUENESS

        - stage: 11
          name: CANONICAL_SEQUENCE

        - stage: 12
          name: ARTIFACT_DIGEST_CONSTRUCTION

        - stage: 13
          name: CHECKPOINT_DIGEST_CONSTRUCTION

        - stage: 14
          name: BUNDLE_ID_DERIVATION

    require_complete_recognition_artifact_set: true
    require_shared_recognition_unit_identity: true
    require_complete_artifact_digest_set: true
    require_checkpoint_digest: true

    require_candidate_evaluation_to_selection_lineage: true
    require_candidate_evaluation_to_seam_lineage: true
    require_selection_to_orientation_lineage: true
    require_seam_to_orientation_lineage: true
    require_orientation_to_seam_aware_result_lineage: true

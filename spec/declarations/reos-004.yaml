id: REOS-004
type: recognition_transition
status: RATIFIED

title: Directional Momentum Qualification

horizon: Movement Horizon

prerequisites:
  - v0.1.0-reos-vs001
  - v0.2.0-reos-vs002
  - v0.3.0-reos-vs003
  - v1.0.0-reos-topology-001

description: >
  Extend a constitutionally resolved recognition state into governed
  directional admission, momentum assessment, and movement qualification.

  REOS-004 consumes a compiler-certified TransitionTopology bound by exact
  identity and digest through TransitionContract. Runtime components may
  contextualize ratified one-hop directed edges but may not invent, infer,
  modify, substitute, or expand topology.

  REOS-004 qualifies whether one admitted directional relationship possesses
  sufficient governed evidence for later movement processing. It does not
  execute movement, activate a Shunt, invoke Ontology, select a remedy, or
  produce a protocol.

constitutional_intent:
  - preserve the frozen Recognition Horizon
  - consume frozen REOS-TOPOLOGY-001 structural law
  - distinguish structural direction from evidentiary momentum
  - qualify directional evidence without executing movement
  - preserve uncertainty when no single direction qualifies
  - prevent active SEAM state from silently becoming movement authority
  - prevent runtime topology invention or substitution
  - establish one canonical actionable recognition boundary below the Recognition Freeze Line
  - establish one canonical verified topology boundary for directional generation
  - prohibit independent downstream authority for nested recognition evidence
  - preserve directional candidate identity and population through momentum evaluation
  - require typed qualification reasons and termination evidence

inputs:
  - recognition_unit
  - candidate_basin_evaluation
  - basin_selection
  - seam_activation_condition
  - orientation_resolution
  - seam_aware_recognition_result
  - transition_topology
  - transition_contract

movement_ingress_rule:
  sole_actionable_recognition_input:
    - frozen_recognition_bundle

  sole_actionable_topology_input:
    - verified_topology_bundle

  independently_actionable_below_freeze_line:
    candidate_basin_evaluation: false
    basin_selection: false
    seam_activation_condition: false
    orientation_resolution: false
    seam_aware_recognition_result: false
    transition_topology: false

outputs:
  - frozen_recognition_bundle
  - verified_topology_bundle
  - directional_candidate_set
  - directional_momentum_assessment
  - movement_qualification_result
  - transition_telemetry

authorized_operations:
  - ingress_hash
  - instantiate_recognition_unit
  - generate_candidate_basins
  - evaluate_candidate_basins
  - determine_primary_basin
  - record_rejected_basins
  - detect_seam_activation
  - resolve_orientation
  - assemble_recognition_result
  - bind_recognition_checkpoint
  - verify_topology_binding
  - generate_directional_candidates
  - evaluate_directional_momentum
  - qualify_movement
  - emit_transition_telemetry

topology_authority:
  required: true
  topology_id: TT-REOS-001
  topology_version: 1.0.0
  topology_digest: COMPILER_BOUND
  maximum_hops: 1
  permitted_relationship_types:
    - DIRECT_MOVEMENT_ELIGIBILITY

operation_parameters:
  bind_recognition_checkpoint:
    required_artifact_count: 5

    required_artifact_kinds:
      - CANDIDATE_BASIN_EVALUATION
      - BASIN_SELECTION
      - SEAM_ACTIVATION_CONDITION
      - ORIENTATION_RESOLUTION
      - SEAM_AWARE_RECOGNITION_RESULT

    exact_artifact_set_required: true
    additional_artifact_bindings_prohibited: true
    duplicate_artifact_kinds_prohibited: true
    duplicate_artifact_ids_prohibited: true
    exactly_one_binding_per_required_kind: true

    canonical_artifact_binding_sequence:
      - CANDIDATE_BASIN_EVALUATION
      - BASIN_SELECTION
      - SEAM_ACTIVATION_CONDITION
      - ORIENTATION_RESOLUTION
      - SEAM_AWARE_RECOGNITION_RESULT

    canonical_artifact_binding_sequence_required: true
    artifact_binding_sequence_is_identity_bearing: true

    require_complete_recognition_artifact_set: true
    require_shared_recognition_unit_identity: true
    require_complete_artifact_digest_set: true
    require_checkpoint_digest: true

    require_candidate_evaluation_to_selection_lineage: true
    require_candidate_evaluation_to_seam_lineage: true
    require_selection_to_orientation_lineage: true
    require_seam_to_orientation_lineage: true
    require_orientation_to_seam_aware_result_lineage: true
    require_base_result_recognition_unit_parity: true
    require_base_result_selection_outcome_parity: true

    prohibit_nested_artifact_omission: true
    prohibit_nested_artifact_mutation: true
    prohibit_exact_selection_identity_claim_without_source_link: true

  verify_topology_binding:
    require_exact_topology_id: true
    require_exact_topology_version: true
    require_exact_topology_digest: true
    require_bound_contract_id: true
    require_bound_contract_digest: true
    embed_verified_topology_snapshot: true
    prohibit_unverified_topology_reentry: true
    fail_closed_on_mismatch: true

  generate_directional_candidates:
    maximum_hops: 1
    minimum_candidate_count: 0
    maximum_candidate_count: 3
    require_source_primary_basin_match: true
    require_ratified_edge_status: true
    permitted_relationship_types:
      - DIRECT_MOVEMENT_ELIGIBILITY

  evaluate_directional_momentum:
    minimum_directional_evidence_score: 0.60
    minimum_evidence_item_count: 1
    require_distinct_source_and_target: true

  qualify_movement:
    permit_from_oriented_state: true
    permit_from_seam_active_state: true
    require_single_qualified_direction: true
    fail_closed_on_tie: true
    fail_closed_on_no_qualified_direction: true

constraints:
  deterministic_execution: true
  recognition_state_immutable: true
  primary_basin_immutable: true
  seam_state_immutable: true
  candidate_scores_immutable: true
  transition_topology_immutable: true
  topology_binding_required: true
  runtime_topology_invention_prohibited: true
  runtime_reverse_edge_inference_prohibited: true
  runtime_topology_substitution_prohibited: true
  single_hop_only: true
  movement_is_qualified_not_executed: true
  directional_target_must_be_known_basin: true
  source_and_target_must_be_distinct: true
  compiler_parameters_required: true
  telemetry_required: true
  provenance_required: true
  independent_verification_required: true
  fail_closed_on_lineage_mismatch: true
  fail_closed_on_missing_parameters: true
  fail_closed_on_unknown_target_basin: true
  fail_closed_on_topology_binding_mismatch: true
  single_actionable_recognition_exit_required: true
  independent_recognition_inputs_below_freeze_prohibited: true
  five_artifact_recognition_checkpoint_required: true
  basin_selection_binding_required: true
  base_result_selection_outcome_parity_required: true
  exact_historical_selection_identity_not_asserted: true
  exact_recognition_artifact_set_required: true
  additional_recognition_artifact_bindings_prohibited: true
  duplicate_recognition_artifact_kinds_prohibited: true
  duplicate_recognition_artifact_ids_prohibited: true
  canonical_recognition_artifact_sequence_required: true
  canonical_recognition_artifact_sequence_identity_bearing: true
  binder_failure_reason_vocabulary_declaration_controlled: true
  single_verified_topology_input_required: true
  unverified_topology_reentry_prohibited: true
  recognition_reinterpretation_below_freeze_prohibited: true
  candidate_population_preservation_required: true
  candidate_identity_preservation_required: true
  typed_qualification_reason_required: true
  typed_ambiguity_evidence_required: true
  typed_unresolved_requirements_required: true
  foundation_domain_semantics_prohibited: true

movement_states:
  - QUALIFIED
  - NOT_QUALIFIED
  - AMBIGUOUS
  - UNRESOLVED

qualification_reason_codes:
  - QUALIFIED_SINGLE_DIRECTION
  - NO_DIRECTION_MEETS_THRESHOLD
  - MULTIPLE_DIRECTIONS_MEET_THRESHOLD
  - INSUFFICIENT_EVIDENCE_ITEMS
  - MISSING_REQUIRED_LINEAGE
  - CANDIDATE_POPULATION_MISMATCH
  - TOPOLOGY_BINDING_INVALID
  - RECOGNITION_CHECKPOINT_INVALID

ambiguity_codes:
  - MULTIPLE_EQUAL_QUALIFIED_DIRECTIONS
  - MULTIPLE_NONDOMINANT_DIRECTIONS

unresolved_requirement_codes:
  - REQUIRED_EVIDENCE_MISSING
  - REQUIRED_LINEAGE_MISSING
  - REQUIRED_CONTRACT_PARAMETER_MISSING
  - CANDIDATE_NOT_SCORABLE

recognition_checkpoint_failure_reason_codes:
  - MISSING_REQUIRED_ARTIFACT
  - RECOGNITION_UNIT_MISMATCH
  - EVALUATION_LINEAGE_MISMATCH
  - SELECTION_LINEAGE_MISMATCH
  - SEAM_LINEAGE_MISMATCH
  - ORIENTATION_LINEAGE_MISMATCH
  - BASE_RESULT_RECOGNITION_UNIT_MISMATCH
  - BASE_RESULT_SELECTION_OUTCOME_MISMATCH
  - ARTIFACT_SET_MISMATCH
  - DUPLICATE_ARTIFACT_KIND
  - DUPLICATE_ARTIFACT_ID
  - CANONICAL_SEQUENCE_VIOLATION
  - DIGEST_CONSTRUCTION_FAILURE

recognition_checkpoint_failure_semantics:
  exception_family:
    - RecognitionCheckpointBindingError

  reason_code_required: true
  runtime_defined_reason_codes_prohibited: true
  boolean_failure_return_prohibited: true
  null_failure_return_prohibited: true
  silent_repair_prohibited: true
  fail_closed_required: true

qualification_evidence_requirements:
  required_fields:
    - reason_code
    - candidate_refs
    - evidence_refs
    - governing_rule_refs
    - assessment_digest
    - contract_digest

  conditional_fields:
    AMBIGUOUS:
      - ambiguity_code

    UNRESOLVED:
      - unresolved_requirements

  runtime_defined_reason_codes_prohibited: true

boundary_nouns:
  frozen_recognition_bundle:
    constitutional_category: IMMUTABLE_BOUNDARY_BUNDLE

    minimum_identity:
      - bundle_id
      - recognition_unit_id
      - candidate_evaluation_ref
      - basin_selection_ref
      - seam_activation_condition_ref
      - orientation_resolution_ref
      - seam_aware_result_ref
      - artifact_bindings
      - recognition_checkpoint_digest

    authority:
      - sole_actionable_recognition_input_below_freeze_line

    invariants:
      - all_nested_artifacts_are_immutable
      - all_nested_artifacts_form_one_verified_lineage_chain
      - artifact_bindings_are_an_exact_closed_set
      - artifact_bindings_contain_exactly_one_entry_per_required_kind
      - artifact_bindings_contain_no_duplicate_artifact_kinds
      - artifact_bindings_contain_no_duplicate_artifact_ids
      - artifact_bindings_follow_the_declared_canonical_sequence
      - canonical_artifact_binding_sequence_is_part_of_checkpoint_identity
      - artifact_bindings_are_not_reordered_downstream
      - candidate_evaluation_and_seam_condition_share_recognition_unit_identity
      - base_result_shares_recognition_unit_identity
      - basin_selection_links_to_candidate_evaluation
      - seam_condition_links_to_candidate_evaluation
      - orientation_links_to_basin_selection
      - orientation_links_to_seam_condition
      - seam_aware_result_links_to_orientation
      - base_result_selection_outcome_matches_basin_selection
      - exact_selection_artifact_identity_is_not_claimed_without_preserved_source_link
      - digest_covers_complete_five_artifact_bundle
      - no_nested_artifact_is_independently_actionable_downstream

  verified_topology_bundle:
    constitutional_category: IMMUTABLE_BOUNDARY_BUNDLE

    minimum_identity:
      - binding_id
      - topology_ref
      - topology_id
      - topology_version
      - topology_digest
      - bound_contract_id
      - bound_contract_digest
      - verification_state

    authority:
      - sole_actionable_topology_input_for_direction_generation

    invariants:
      - exact_verified_topology_snapshot_is_bound
      - topology_and_contract_identity_are_immutable
      - unverified_topology_reentry_is_prohibited
      - digest_mismatch_fails_closed


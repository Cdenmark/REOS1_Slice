constitutional_leakage_audit:
  recognition_boundary:
    actionable_exits: 1
    canonical_exit: frozen_recognition_bundle
    required_bound_artifact_count: 5
    exact_artifact_set: required
    additional_artifact_bindings: forbidden
    duplicate_artifact_kinds: forbidden
    duplicate_artifact_ids: forbidden
    exactly_one_binding_per_required_kind: required
    canonical_binding_sequence: required
    canonical_binding_sequence_identity_bearing: required
    binder_failure_reason_vocabulary: declaration_controlled
    binder_state_model: stateless
    mutable_binder_state: forbidden
    artifact_authenticity: required
    artifact_authenticity_model: CONSTITUTIONAL_NOUN_ADMISSIBILITY
    python_class_identity_as_constitutional_proof: forbidden
    structural_shape_as_constitutional_proof: forbidden
    serializability_as_constitutional_proof: forbidden
    governed_noun_authorization: required
    structural_lookalike_substitution: forbidden
    canonical_artifact_material_schema: explicit
    canonical_checkpoint_material_schema: explicit
    checkpoint_digest_identity_derivation: explicit
    bundle_identity_derivation: explicit
    failure_reason_mapping: explicit
    multi_failure_precedence: deterministic
    runtime_failure_discretion: forbidden
    domain_payload_semantic_interpretation: forbidden
    complete_payload_digest_serialization: permitted
    candidate_score_interpretation: forbidden
    topology_observation: forbidden
    transition_contract_observation: forbidden
    telemetry_observation: forbidden
    clock_dependency: forbidden
    execution_environment_dependency: forbidden
    basin_selection_binding: required
    independent_recognition_inputs_below_freeze_line: 0
    exact_selection_identity_claim_without_source_link: forbidden

  topology_boundary:
    actionable_inputs: 1
    canonical_input: verified_topology_bundle
    separately_supplied_unverified_topology: forbidden

  directional_generation:
    recognition_reinterpretation: forbidden
    topology_invention: forbidden
    contract_bypass: forbidden

  momentum_evaluation:
    candidate_population_preserved: required
    candidate_identity_preserved: required
    silent_candidate_loss: forbidden

  qualification:
    typed_termination_state: required
    typed_reason_code: required
    typed_ambiguity_evidence: required
    typed_unresolved_requirements: required

  clean_room_verification:
    delegated_authority_chain_traversable: required
    runtime_imports: forbidden

  foundation:
    domain_semantics: forbidden

  result: LEAK_FREE


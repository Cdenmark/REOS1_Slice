  directional_candidate_generator:
    consumes:
      - frozen_recognition_bundle
      - verified_topology_bundle
      - transition_contract

    produces:
      - directional_candidate_set

    constitutional_question: >
      Can valid frozen recognition evidence, valid verified topology evidence,
      and active transition authority lawfully converge to determine and emit
      the exact deterministic set of ratified one-hop directional possibilities?

    question_is_not:
      - final_movement_qualification
      - movement_admission
      - movement_execution
      - candidate_ranking
      - candidate_preference

    owns:
      - frozen_source_basin_binding
      - deterministic_frozen_predicate_matching
      - verified_one_hop_edge_admission
      - ratified_edge_filtering
      - contract_rule_application
      - directional_candidate_identity_construction
      - candidate_generation_lineage
      - three_evidence_convergence_adjudication
      - directional_candidate_set_constitutional_rendering

    prohibited:
      - topology_construction
      - topology_modification
      - multi_hop_traversal
      - reverse_edge_inference
      - implicit_edge_generation
      - directional_score_assignment
      - movement_qualification
      - basin_selection
